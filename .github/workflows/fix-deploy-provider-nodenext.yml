name: Fix Deploy Provider NodeNext

on:
  push:
    branches:
      - fix/deploy-provider-nodenext

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nodenext]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply NodeNext declaration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          replacements = {
              'src/deployProvider.ts': {
                  "'./types/deployMonetization'": "'./types/deployMonetization.js'",
                  "'./types/deployProvider'": "'./types/deployProvider.js'",
                  "'./types/deployRelease'": "'./types/deployRelease.js'",
                  "'./types/deployStoreListing'": "'./types/deployStoreListing.js'",
              },
              'src/types/deployProvider.ts': {
                  "'../deploy'": "'../deploy.js'",
                  "'./deployMonetization'": "'./deployMonetization.js'",
                  "'./deployRelease'": "'./deployRelease.js'",
                  "'./deployStoreListing'": "'./deployStoreListing.js'",
              },
              'src/types/deployMonetization.ts': {"'./deployProvider'": "'./deployProvider.js'"},
              'src/types/deployRelease.ts': {"'./deployProvider'": "'./deployProvider.js'"},
              'src/types/deployStoreListing.ts': {"'./deployProvider'": "'./deployProvider.js'"},
          }
          for path, mapping in replacements.items():
              file = Path(path)
              text = file.read_text()
              for old, new in mapping.items():
                  text = text.replace(old, new)
              file.write_text(text)

          consumer = Path('consumer-tests/deployProviderNodeNext.ts')
          consumer.parent.mkdir(parents=True, exist_ok=True)
          consumer.write_text("""import type {\n  AndroidDeploymentBuilder,\n  AndroidDeploymentPublisher,\n  DeploymentMonetizationAdapter,\n  DeploymentProviderRegistration,\n  DeploymentProviderSetupAdapter,\n  DeploymentReleaseAdapter,\n  DeploymentStoreListingAdapter,\n  IosDeploymentBuilder,\n  IosDeploymentPublisher,\n  WebDeploymentPublisher,\n} from '@ankhorage/contracts/deploy-provider';\n\nexport type DeployProviderNodeNextContract = readonly [\n  DeploymentProviderRegistration,\n  DeploymentProviderSetupAdapter,\n  WebDeploymentPublisher,\n  AndroidDeploymentBuilder,\n  AndroidDeploymentPublisher,\n  IosDeploymentBuilder,\n  IosDeploymentPublisher,\n  DeploymentStoreListingAdapter,\n  DeploymentMonetizationAdapter,\n  DeploymentReleaseAdapter,\n];\n""")

          Path('tsconfig.deploy-provider-consumer.json').write_text("""{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"module\": \"NodeNext\",\n    \"moduleResolution\": \"NodeNext\",\n    \"strict\": true,\n    \"noEmit\": true,\n    \"skipLibCheck\": false,\n    \"types\": [\"node\"]\n  },\n  \"include\": [\"consumer-tests/deployProviderNodeNext.ts\"]\n}\n""")

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['typecheck'] = (
              'tsc --noEmit -p tsconfig.json && '
              'tsc --noEmit -p tsconfig.infra-tests.json && '
              'bun run build && '
              'tsc --noEmit -p tsconfig.deploy-provider-consumer.json'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('.changeset/deploy-provider-nodenext.md').write_text("""---\n\"@ankhorage/contracts\": patch\n---\n\nMake deploy-provider declarations resolvable by NodeNext consumers and validate the built package self-export.\n""")
          PY
      - run: bun run format
      - run: bun run build
      - run: bun run typecheck
      - name: Commit fixes
        run: |
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add src/deployProvider.ts src/types/deployProvider.ts src/types/deployMonetization.ts src/types/deployRelease.ts src/types/deployStoreListing.ts consumer-tests tsconfig.deploy-provider-consumer.json package.json .changeset/deploy-provider-nodenext.md
          git commit -m "fix: make deploy provider declarations NodeNext compatible [nodenext]"
          git push origin HEAD:fix/deploy-provider-nodenext
