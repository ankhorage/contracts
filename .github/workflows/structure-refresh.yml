name: Structure Refresh

on:
  push:
    branches:
      - feat/267-theme-structure-root

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Refresh generator dependencies
        run: bun install
      - name: Generate canonical structure
        run: ./node_modules/.bin/ankhorage-structure build .
      - name: Commit generated evidence
        run: |
          git config user.name "ankhorage-structure[bot]"
          git config user.email "ankhorage-structure[bot]@users.noreply.github.com"
          git add bun.lock src/structure/generated.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate theme structure"
          git push
