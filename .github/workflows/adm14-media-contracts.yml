name: ADM-14 Media Contracts Gate

on:
  push:
    branches:
      - adm14/media-contracts
    paths:
      - .github/workflows/adm14-media-contracts.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Apply media contract integration
        run: node scripts/adm14-media-contracts.mjs
      - name: Format authored changes
        run: bun run format
      - name: Build
        run: bun run build
      - name: Generate documentation
        run: bun run docs
      - name: Format generated documentation
        run: bun run format
      - name: Validate repository
        run: |
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status
      - name: Validate package contents
        run: npm pack --dry-run
      - name: Guard generated documentation paths
        run: |
          if grep -R -n -E '/home/runner/|/Users/' README.md paradox; then
            echo 'Generated documentation contains a machine-specific path.' >&2
            exit 1
          fi
      - name: Remove temporary gate files
        run: rm scripts/adm14-media-contracts.mjs .github/workflows/adm14-media-contracts.yml
      - name: Commit validated media contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add canonical media authoring contracts"
          git push origin HEAD:adm14/media-contracts
