name: ADM-14 UI Media Gate

on:
  push:
    branches:
      - agent/adm14-ui-media-metadata

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate repository conventions
        run: bunx @ankhorage/doctor@0.8.0 validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify changeset
        run: bun run changeset:status

      - name: Guard generated documentation paths
        run: |
          if grep -R -E '/home/runner|/Users/|[A-Za-z]:\\Users\\' README.md paradox; then
            echo 'Generated docs contain machine-specific paths.'
            exit 1
          fi

      - name: Verify clean patches
        run: git diff --check

      - name: Remove temporary gate workflow
        run: rm .github/workflows/adm14-ui-media-gate.yml

      - name: Commit validated UI media metadata state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Validate ADM-14 UI media metadata'
          git push origin HEAD:agent/adm14-ui-media-metadata
