name: Auth 4 format once

on:
  push:
    branches:
      - agent/auth4-oauth-setup-requirements-pr
    paths:
      - .github/workflows/auth4-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth4-oauth-setup-requirements-pr
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auth4-format-once.yml
          git add -A
          git commit -m "Apply Auth 4 formatter output"
          git push origin HEAD:agent/auth4-oauth-setup-requirements-pr
