name: Regenerate screen metadata structure

on:
  push:
    branches:
      - chore/244-generate-screen-metadata-evidence

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/244-screen-metadata-structure
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate canonical structure evidence
        run: ./node_modules/.bin/ankhorage-structure build .

      - name: Commit generated evidence
        run: |
          if git diff --quiet -- src/structure/generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structure/generated.ts
          git commit -m "chore: regenerate screen metadata structure evidence"
          git push origin HEAD:feat/244-screen-metadata-structure
