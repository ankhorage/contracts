name: Auth 4 Contracts Finalizer

on:
  push:
    branches:
      - agent/auth4-platform-environment-contracts

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Materialize authored slice
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/auth4-contracts-wire.yml').read_text()
          for path in (
              'src/appManifest/deploy.ts',
              'src/deploy.test.ts',
              '.changeset/auth4-platform-environments.md',
          ):
              marker = f"          cat > {path} <<'EOF'\n"
              start = source.index(marker) + len(marker)
              end = source.index('\n          EOF', start)
              lines = source[start:end].splitlines()
              body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body + '\n')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: |
          bun run lint:fix
          bun run format

      - name: Commit authored slice locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/deploy.ts src/appManifest/deploy.ts src/deploy.test.ts .changeset/auth4-platform-environments.md
          git commit -m 'Complete Auth 4 platform contracts'

      - name: Validate Contracts
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          bunx @ankhorage/ankh doctor validate .
          bun run changeset:status
          git diff --check

      - name: Commit generated docs and remove temporary gates
        run: |
          rm .github/workflows/auth4-contracts-wire.yml .github/workflows/auth4-contracts-finalize.yml
          git add README.md paradox .github/workflows/auth4-contracts-wire.yml .github/workflows/auth4-contracts-finalize.yml
          git commit -m 'Refresh Auth 4 contract docs'
          git push origin HEAD:agent/auth4-platform-environment-contracts
