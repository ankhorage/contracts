name: Apply Phase 1 auth contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-canonical-auth-flow
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply contract changes
        run: python .github/apply-phase1-contract.py

      - name: Validate
        run: |
          set -euo pipefail
          bun install --frozen-lockfile >/tmp/bun-install.log 2>&1 || { cat /tmp/bun-install.log; exit 1; }
          bun run build >/tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
          bun run lint >/tmp/lint.log 2>&1 || { cat /tmp/lint.log; exit 1; }
          bun run format:check >/tmp/format.log 2>&1 || { cat /tmp/format.log; exit 1; }
          bun run knip >/tmp/knip.log 2>&1 || { cat /tmp/knip.log; exit 1; }
          bun run test >/tmp/test.log 2>&1 || { cat /tmp/test.log; exit 1; }
          bun run typecheck >/tmp/typecheck.log 2>&1 || { cat /tmp/typecheck.log; exit 1; }
          bash scripts/check-changeset-status.sh >/tmp/changeset.log 2>&1 || { cat /tmp/changeset.log; exit 1; }

      - name: Commit contract changes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: canonicalize authentication flow contract'
          git push origin HEAD:agent/phase1-canonical-auth-flow
