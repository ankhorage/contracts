name: Auth 4 setup requirement validation

on:
  push:
    branches:
      - agent/auth4-oauth-setup-requirements
    paths:
      - .github/workflows/auth4-setup-requirements.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth4-oauth-setup-requirements
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and generate docs
        run: |
          bun run format
          bun run docs

      - name: Validate
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status

      - name: Commit validated result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auth4-setup-requirements.yml
          git add -A
          git commit -m "Validate Auth 4 setup contracts"
          git push origin HEAD:agent/auth4-oauth-setup-requirements
