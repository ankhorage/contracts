name: Task generate docs

on:
  push:
    branches:
      - fix/145-scheduled-database-backups
    paths:
      - '.github/workflows/task-generate-docs.yml'
      - 'src/**'
      - 'paradox.config.ts'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/145-scheduled-database-backups

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bunx ankhorage-prettier --write README.md paradox

      - name: Commit generated docs
        run: |
          if git diff --quiet -- README.md paradox; then
            echo 'Generated docs already current.'
            exit 0
          fi
          git config user.name 'ankhorage-renovate-sync[bot]'
          git config user.email 'ankhorage-renovate-sync[bot]@users.noreply.github.com'
          git add README.md paradox
          git commit -m 'docs: regenerate contracts reference'
          git push origin HEAD:fix/145-scheduled-database-backups
