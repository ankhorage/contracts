name: Profile Structure Refresh

on:
  push:
    branches:
      - feat/260-auth-profile-structure

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate canonical structure
        run: ./node_modules/.bin/ankhorage-structure build .
      - name: Commit generated evidence
        run: |
          git config user.name "ankhorage-structure[bot]"
          git config user.email "ankhorage-structure[bot]@users.noreply.github.com"
          git add src/structure/generated.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate auth profile structure"
          git push
