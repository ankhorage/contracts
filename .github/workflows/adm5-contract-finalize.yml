name: ADM5 Contract Finalize

on:
  push:
    branches:
      - agent/adm-5-managed-api-contract

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/adm-5-managed-api-contract
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply canonical managed API contract
        run: |
          python scripts/adm5-contract-finalize.py
          rm scripts/adm5-contract-finalize.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix lint
        run: bun run lint:fix

      - name: Generate docs
        run: bun run docs

      - name: Format
        run: bun run format

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Commit finalized contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish canonical managed API contract"

      - name: Changeset status
        run: bun run changeset:status

      - name: Remove helper and push
        run: |
          rm .github/workflows/adm5-contract-finalize.yml
          git add .github/workflows/adm5-contract-finalize.yml
          git commit -m "ci: remove adm5 contract finalizer"
          git push origin HEAD:agent/adm-5-managed-api-contract
