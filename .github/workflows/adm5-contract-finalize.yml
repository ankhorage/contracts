name: ADM5 Contract Finalize

on:
  push:
    branches:
      - agent/adm-5-managed-api-contract

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/adm-5-managed-api-contract
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply canonical managed API contract
        run: |
          python scripts/adm5-contract-finalize.py
          rm scripts/adm5-contract-finalize.py

      - name: Install and generate
        run: |
          bun install --frozen-lockfile
          bun run lint:fix
          bun run docs
          bun run format

      - name: Validate
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status

      - name: Commit finalized contract and remove helper
        run: |
          rm .github/workflows/adm5-contract-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish canonical managed API contract"
          git push origin HEAD:agent/adm-5-managed-api-contract
