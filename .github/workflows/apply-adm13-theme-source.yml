name: Apply ADM-13 theme source contract

on:
  push:
    branches:
      - adm13/theme-authoring-source

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adm13/theme-authoring-source
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply canonical theme authoring source
        shell: bash
        run: |
          cat > src/theme.ts <<'EOF'
          /** Numeric token values authored at theme level. */
          export type ThemeNumericTokenOverrides = Readonly<Record<string, number>>;

          /** String token values authored at theme level. */
          export type ThemeStringTokenOverrides = Readonly<Record<string, string>>;

          /** Partial authored override for one semantic heading recipe. */
          export interface ThemeTypographyHeadingOverrides {
            readonly size?: number;
            readonly lineHeight?: number;
            readonly weight?: string;
          }

          /** Theme-global typography source overrides. Font installation remains module-owned. */
          export interface ThemeTypographyTokenOverrides {
            readonly headings?: Readonly<Record<string, ThemeTypographyHeadingOverrides>>;
            readonly sizes?: ThemeNumericTokenOverrides;
            readonly weights?: ThemeStringTokenOverrides;
          }

          /**
           * Theme-global authored token overrides.
           *
           * Color source remains mode-specific on ThemeModeConfig. These values are shared by
           * light and dark mode and are resolved by the render-theme owner rather than copied
           * into every mode branch.
           */
          export interface ThemeGlobalTokenOverrides {
            readonly spacing?: ThemeNumericTokenOverrides;
            readonly radii?: ThemeNumericTokenOverrides;
            readonly typography?: ThemeTypographyTokenOverrides;
            readonly shadows?: ThemeNumericTokenOverrides;
          }

          /** Serializable value supported by the current ZORA theme-recipe metadata field kinds. */
          export type ThemeRecipeOverrideValue = boolean | string;

          /** Persisted values for one component or pattern recipe. */
          export type ThemeRecipeFieldOverrides = Readonly<
            Record<string, ThemeRecipeOverrideValue>
          >;

          /**
           * Generic persisted recipe values.
           *
           * The owning UI package defines available recipes, field schemas, defaults and token
           * relationships. Contracts stores selected values only and does not duplicate that metadata.
           */
          export interface ThemeRecipeOverrides {
            readonly components?: Readonly<Record<string, ThemeRecipeFieldOverrides>>;
            readonly patterns?: Readonly<Record<string, ThemeRecipeFieldOverrides>>;
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/types.ts',
              "import type { ScreenRequirements } from './requirements';",
              "import type { ScreenRequirements } from './requirements';\nimport type { ThemeGlobalTokenOverrides, ThemeRecipeOverrides } from './theme';",
          )
          replace_once(
              'src/types.ts',
              "export interface ThemeConfig {\n  id: string;\n  name: string;\n  light: ThemeModeConfig;\n  dark: ThemeModeConfig;\n}",
              "export interface ThemeConfig {\n  id: string;\n  name: string;\n  light: ThemeModeConfig;\n  dark: ThemeModeConfig;\n  /** Theme-global authored token overrides shared by light and dark mode. */\n  tokens?: ThemeGlobalTokenOverrides;\n  /** Component/pattern recipe override values; recipe schemas remain package-owned metadata. */\n  recipes?: ThemeRecipeOverrides;\n}",
          )
          replace_once(
              'src/index.ts',
              "export * from './storage';\nexport * from './types';",
              "export * from './storage';\nexport * from './theme';\nexport * from './types';",
          )

          test_file = Path('src/contracts.test.ts')
          test_text = test_file.read_text()
          marker = "  it('accepts serializable splash screen branding on app manifests', () => {"
          if test_text.count(marker) != 1:
              raise SystemExit('theme contract test insertion marker mismatch')
          new_test = '''  it('serializes authored global theme tokens and recipe override values', () => {
            const theme: ThemeConfig = {
              id: 'theme-default',
              name: 'Default',
              light: {
                primaryColor: '#3366ff',
                harmony: 'analogous',
              },
              dark: {
                primaryColor: '#7799ff',
                harmony: 'analogous',
              },
              tokens: {
                spacing: { m: 18, l: 28 },
                radii: { m: 10, l: 18 },
                typography: {
                  sizes: { body: 16, lead: 20 },
                  weights: { body: '400', strong: '700' },
                  headings: {
                    h1: { size: 34, lineHeight: 42, weight: '700' },
                  },
                },
                shadows: { soft: 3 },
              },
              recipes: {
                components: {
                  Card: { compact: true, padding: 'l', radius: 'm', tone: 'subtle' },
                },
                patterns: {
                  Panel: { compact: false, padding: 'xl' },
                },
              },
            };

            expect(JSON.parse(JSON.stringify(theme))).toEqual(theme);
            expect(theme.tokens?.spacing?.m).toBe(18);
            expect(theme.recipes?.components?.Card?.compact).toBe(true);
            expect(theme.recipes?.patterns?.Panel?.padding).toBe('xl');
          });

'''
          test_file.write_text(test_text.replace(marker, new_test + marker, 1))

          Path('.changeset/adm13-theme-authoring-source.md').write_text('''---
          "@ankhorage/contracts": minor
          ---

          Add canonical serializable theme-global token overrides and generic component/pattern recipe override values without duplicating runtime token state or package-owned recipe metadata.
          ''')
          PY
      - name: Format
        run: bun run format
      - name: Validate source
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          bun run format
      - name: Commit product diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .changeset README.md paradox
          git commit -m "Add canonical theme authoring source contracts"
      - name: Validate committed changeset
        run: bun run changeset:status
      - name: Push product diff
        run: git push origin HEAD:adm13/theme-authoring-source
