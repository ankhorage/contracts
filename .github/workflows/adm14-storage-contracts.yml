name: ADM-14 Storage Capabilities Gate

on:
  push:
    branches:
      - adm14/storage-capabilities

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format authored changes
        run: bun run format
      - name: Build
        run: bun run build
      - name: Generate documentation
        run: bun run docs
      - name: Format generated documentation
        run: bun run format
      - name: Validate repository
        run: |
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status
      - name: Validate package contents
        run: npm pack --dry-run
      - name: Guard generated documentation paths
        run: |
          if grep -R -n -E '/home/runner/|/Users/' README.md paradox; then
            echo 'Machine-specific path found in generated documentation.'
            exit 1
          fi
      - name: Remove temporary gate workflow
        run: rm .github/workflows/adm14-storage-contracts.yml
      - name: Commit validated storage capabilities
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Validate ADM-14 storage capabilities'
          git push
