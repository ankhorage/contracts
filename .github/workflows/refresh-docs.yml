name: Refresh Docs

on:
  push:
    branches:
      - fix/deploy-provider-setup-project-root

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate documentation
        run: bun run docs
      - name: Commit generated documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add README.md paradox
          git commit -m "docs: refresh deploy provider contracts"
          git push origin HEAD:fix/deploy-provider-setup-project-root
